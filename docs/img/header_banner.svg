<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Dark Obsidian Gradient Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#090d16"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Scanning Line Gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0; 1200 0; -1200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1">
        <animateTransform attributeName="transform" type="translate" values="0 0; 40 40; 0 0" dur="24s" repeatCount="indefinite"/>
      </path>
    </pattern>

    <style>
      .main-title {
        font: 900 62px 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 4px;
        fill: url(#textGrad);
      }
      .sub-title {
        font: 700 15px 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 5px;
        fill: #94a3b8;
      }
      .badge-text {
        font: 800 12px 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 2px;
        fill: #38bdf8;
      }
      .hud-text {
        font: 600 11px monospace;
        fill: #475569;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>

  <!-- Radial Core Glow -->
  <circle cx="600" cy="120" r="260" fill="url(#coreGlow)">
    <animate attributeName="r" values="220;270;220" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Bottom Waves -->
  <path d="M 0 210 Q 300 170 600 210 T 1200 210 L 1200 280 L 0 280 Z" fill="url(#waveGrad2)" opacity="0.5">
    <animate attributeName="d"
             values="M 0 210 Q 300 170 600 210 T 1200 210 L 1200 280 L 0 280 Z;
                     M 0 200 Q 300 230 600 190 T 1200 220 L 1200 280 L 0 280 Z;
                     M 0 210 Q 300 170 600 210 T 1200 210 L 1200 280 L 0 280 Z"
             dur="8s" repeatCount="indefinite"/>
  </path>

  <path d="M 0 220 Q 300 250 600 210 T 1200 230 L 1200 280 L 0 280 Z" fill="url(#waveGrad1)">
    <animate attributeName="d"
             values="M 0 220 Q 300 250 600 210 T 1200 230 L 1200 280 L 0 280 Z;
                     M 0 230 Q 300 180 600 240 T 1200 200 L 1200 280 L 0 280 Z;
                     M 0 220 Q 300 250 600 210 T 1200 230 L 1200 280 L 0 280 Z"
             dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Scanning Laser Beam Line -->
  <line x1="0" y1="28" x2="1200" y2="28" stroke="url(#scanGrad)" stroke-width="2.5" filter="url(#softGlow)"/>

  <!-- Top HUD accents -->
  <g transform="translate(40, 32)">
    <text class="hud-text">SYS.ID // OZ-2026-ENG</text>
  </g>
  <g transform="translate(1000, 32)">
    <text class="hud-text">STATUS // ONLINE ●</text>
  </g>

  <!-- Main Title -->
  <g filter="url(#neonGlow)">
    <text x="600" y="125" text-anchor="middle" class="main-title">ÖZGÜR KALÇIK</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="165" text-anchor="middle" class="sub-title">COMPUTER ENGINEERING STUDENT (YEAR 2) • AI &amp; CYBER SECURITY</text>

  <!-- Status Chip Badges -->
  <g transform="translate(415, 182)" filter="url(#softGlow)">
    <rect width="115" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="57" y="17" text-anchor="middle" class="badge-text">AI &amp; ML</text>
  </g>

  <g transform="translate(542, 182)" filter="url(#softGlow)">
    <rect width="130" height="26" rx="13" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="65" y="17" text-anchor="middle" class="badge-text" fill="#a855f7">CYBER SEC</text>
  </g>

  <g transform="translate(684, 182)" filter="url(#softGlow)">
    <rect width="102" height="26" rx="13" fill="#0f172a" stroke="#ec4899" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="51" y="17" text-anchor="middle" class="badge-text" fill="#ec4899">YEAR 2</text>
  </g>
</svg>
