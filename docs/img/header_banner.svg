<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="200">
  <defs>
    <!-- Deep Obsidian Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Sleek Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Subtle Border Stream -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom Moving Neon Line -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0; 1200 0; -1200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .main-title {
        font: 800 52px 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 6px;
        fill: url(#titleGrad);
      }
      .sub-title {
        font: 600 15px 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 5px;
        fill: #94a3b8;
      }
      .dot {
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="200" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="198" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Center Radial Glow -->
  <circle cx="600" cy="100" r="260" fill="url(#centerGlow)"/>

  <!-- Main Title -->
  <g filter="url(#glow)">
    <text x="600" y="100" text-anchor="middle" class="main-title">ÖZGÜR KALÇIK</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="142" text-anchor="middle" class="sub-title">
    2ND YEAR COMPUTER ENGINEERING STUDENT <tspan class="dot">•</tspan> AI &amp; CYBER SECURITY
  </text>

  <!-- Bottom Animated Neon Line -->
  <line x1="40" y1="180" x2="1160" y2="180" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
