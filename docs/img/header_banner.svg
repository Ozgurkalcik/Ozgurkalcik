<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260">
  <defs>
    <!-- Sleek Dark Obsidian Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="60%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Elegant Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Minimal Border Accent Stream -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0; 600 0; -600 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Smooth Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .main-title {
        font: 800 58px 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 5px;
        fill: url(#textGrad);
      }
      .sub-title {
        font: 600 16px 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 6px;
        fill: #94a3b8;
      }
      .dot {
        fill: #38bdf8;
      }
      .accent-tag {
        font: 700 12px monospace;
        letter-spacing: 3px;
        fill: #64748b;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="260" rx="20" fill="url(#bg)"/>

  <!-- Ambient Glow Center -->
  <circle cx="600" cy="130" r="280" fill="url(#ambientGlow)">
    <animate attributeName="r" values="240;290;240" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Sleek Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="256" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Smooth Minimal Wave Accent (Bottom) -->
  <path d="M 0 200 Q 300 175 600 200 T 1200 200 L 1200 260 L 0 260 Z" fill="url(#wave1)">
    <animate attributeName="d"
             values="M 0 200 Q 300 175 600 200 T 1200 200 L 1200 260 L 0 260 Z;
                     M 0 190 Q 300 215 600 185 T 1200 205 L 1200 260 L 0 260 Z;
                     M 0 200 Q 300 175 600 200 T 1200 200 L 1200 260 L 0 260 Z"
             dur="10s" repeatCount="indefinite"/>
  </path>

  <path d="M 0 215 Q 300 235 600 205 T 1200 220 L 1200 260 L 0 260 Z" fill="url(#wave2)">
    <animate attributeName="d"
             values="M 0 215 Q 300 235 600 205 T 1200 220 L 1200 260 L 0 260 Z;
                     M 0 225 Q 300 195 600 225 T 1200 210 L 1200 260 L 0 260 Z;
                     M 0 215 Q 300 235 600 205 T 1200 220 L 1200 260 L 0 260 Z"
             dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Top Minimal Tag -->
  <text x="600" y="62" text-anchor="middle" class="accent-tag">PORTFOLIO // 2026</text>

  <!-- Main Title -->
  <g filter="url(#softGlow)">
    <text x="600" y="132" text-anchor="middle" class="main-title">ÖZGÜR KALÇIK</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="172" text-anchor="middle" class="sub-title">
    COMPUTER ENGINEERING STUDENT <tspan class="dot">•</tspan> AI &amp; CYBER SECURITY
  </text>
</svg>
