<svg width="760" height="250" viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="250"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#052e2b"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="45%" stop-color="#22c55e"/><stop offset="75%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#2dd4bf"/><animateTransform attributeName="gradientTransform" type="translate" values="-120 0;120 0;-120 0" dur="5s" repeatCount="indefinite"/></linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.meta{font:800 13px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#99f6e4}.title{font:900 42px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.desc{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#a7f3d0}.tag{font:800 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#d1fae5}</style>
  </defs>
  <rect width="760" height="250" rx="24" fill="url(#bg)"/>
  <rect x="6" y="6" width="748" height="238" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="340 86" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-426" dur="16s" repeatCount="indefinite"/></rect>
  <g transform="translate(92 50)" filter="url(#glow)">
    <!-- Cyber Shield -->
    <path d="M60 10 L110 30 V75 C110 110 60 135 60 135 C60 135 10 110 10 75 V30 Z" fill="#0f766e" fill-opacity="0.3" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round"/>
    <!-- Lock core -->
    <rect x="42" y="70" width="36" height="30" rx="6" fill="#14532d" stroke="#86efac" stroke-width="3"/>
    <path d="M48 70 V54 C48 46 72 46 72 54 V70" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="85" r="4" fill="#67e8f9"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="280" y="74" class="meta">DEFENSIVE &amp; SECURITY MATRIX</text>
  <text x="280" y="126" class="title">CYBER LAB</text>
  <text x="280" y="161" class="desc">Vulnerability analysis, threat defense &amp; security.</text>
  <g transform="translate(280 190)"><rect width="112" height="26" rx="13" fill="#052e2b" stroke="#2dd4bf" stroke-opacity=".55"/><text x="56" y="18" text-anchor="middle" class="tag">SECURITY</text></g>
  <g transform="translate(404 190)"><rect width="138" height="26" rx="13" fill="#052e2b" stroke="#22c55e" stroke-opacity=".55"/><text x="69" y="18" text-anchor="middle" class="tag">ETHICAL HACK</text></g>
</svg>
