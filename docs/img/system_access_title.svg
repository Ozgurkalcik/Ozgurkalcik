<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%" height="100">
  <defs>
    <!-- Rail Line Gradient -->
    <linearGradient id="railGrad" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0; 600 0; -600 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Title Fill Gradient -->
    <linearGradient id="titleFill" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .main-title {
        font: 800 20px 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 6px;
        fill: url(#titleFill);
      }
      .sub-title {
        font: 600 11px 'Segoe UI', system-ui, -apple-system, monospace;
        letter-spacing: 4px;
        fill: #64748b;
      }
    </style>
  </defs>

  <!-- Left & Right Connecting Rails -->
  <line x1="20" y1="50" x2="330" y2="50" stroke="url(#railGrad)" stroke-width="1.5"/>
  <line x1="670" y1="50" x2="980" y2="50" stroke="url(#railGrad)" stroke-width="1.5"/>

  <!-- Animated Laser Pulse Lines -->
  <line x1="20" y1="50" x2="330" y2="50" stroke="url(#pulseGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="670" y1="50" x2="980" y2="50" stroke="url(#pulseGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Outer Rail Dots -->
  <circle cx="20" cy="50" r="3" fill="#38bdf8"/>
  <circle cx="980" cy="50" r="3" fill="#ec4899"/>

  <!-- Center Title Pill Frame -->
  <g transform="translate(350, 20)" filter="url(#softGlow)">
    <rect width="300" height="60" rx="30" fill="#0b0f19" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>

  <!-- Left/Right Diamond Accents on Pill -->
  <polygon points="370,50 376,44 382,50 376,56" fill="#38bdf8"/>
  <polygon points="618,50 624,44 630,50 624,56" fill="#a855f7"/>

  <!-- Center Title Text -->
  <text x="500" y="51" text-anchor="middle" class="main-title">SYSTEM ACCESS</text>
  <text x="500" y="66" text-anchor="middle" class="sub-title">AI LAB · CYBER LAB · ALGO FORGE</text>
</svg>